<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5dce5">
  <title>choco café ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="phone-canvas" aria-label="Choco Café pink vintage touch phone">
      <img class="phone-scene" src="https://chococafecafe.github.io/assets/phone-scene.png" alt="Pastel pink vintage phone with a bow-shaped home button">

      <!-- The display is a real webpage layer: its clock and buttons remain interactive. -->
      <section class="display" aria-label="Phone screen">
        <header class="status-bar">
          <span class="carrier">● choco</span>
          <span class="status-right"><span class="wifi" aria-label="Wi-Fi">◖)))</span><span class="battery" aria-label="Battery"></span><time id="statusTime">00:00</time></span>
        </header>

        <section id="lockScreen" class="screen-page lock-screen">
          <div class="lock-date" id="lockDate">SUNDAY, NOVEMBER 22</div>
          <time class="lock-clock" id="lockClock">12:26 AM</time>
          <div class="welcome-kicker">WELCOME TO</div>
          <h1>Choco Café</h1>
          <button class="unlock" id="unlockButton" type="button">
            <span class="unlock-heart">♡</span>
            <span id="unlockLabel">Locked</span>
            <small>touch the heart</small>
          </button>
          <p class="lock-footer">♡　chococafe time　♡</p>
        </section>

        <section id="homeScreen" class="screen-page home-screen" hidden>
          <div class="home-date" id="homeDate">2026.11.22 SUN</div>
          <div class="heart-clock" aria-label="Current time">
            <svg class="heart-svg" viewBox="0 0 220 190" aria-hidden="true"><path d="M110 174 C90 151 20 102 20 57 C20 9 81 -1 110 43 C139 -1 200 9 200 57 C200 102 130 151 110 174Z"/></svg>
            <div class="heart-time"><strong id="homeClock">12:26</strong><small id="homeAmPm">AM</small></div>
          </div>
          <p class="home-greeting">hi this is chococafe</p>
          <div class="app-grid" aria-label="Apps">
            <button class="app-icon" type="button" data-app="dessert"><span class="app-tile strawberry">🍓</span><span>dessert</span></button>
            <button class="app-icon" type="button" data-app="anime"><span class="app-tile ribbon">🎀</span><span>anime</span></button>
            <button class="app-icon" type="button" data-app="music"><span class="app-tile music">♫</span><span>music</span></button>
            <button class="app-icon" type="button" data-app="message"><span class="app-tile message">✉</span><span>message</span></button>
            <button class="app-icon" type="button" data-app="diary"><span class="app-tile diary">♡</span><span>diary</span></button>
            <button class="app-icon" type="button" data-app="calendar"><span class="app-tile calendar">▦</span><span>calendar</span></button>
            <button class="app-icon" type="button" data-app="character"><span class="app-tile character">୨୧</span><span>character</span></button>
          </div>
          <p class="home-footer">choco café</p>
        </section>
      </section>

      <!-- Invisible hit areas sit over the physical buttons in the illustration. -->
      <button class="hardware-hit back-hit" id="backButton" type="button" aria-label="Back"></button>
      <button class="hardware-hit home-hit" id="homeButton" type="button" aria-label="Home"></button>
      <button class="hardware-hit menu-hit" id="menuButton" type="button" aria-label="Menu"></button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
